# Zensical config generated by the document-it skill.
[project]
site_name = "weatherkit"
site_description = "Tiny weather client"
site_url = "https://wushanyun64.github.io/weatherkit/"
repo_url = "https://github.com/wushanyun64/weatherkit"
repo_name = "wushanyun64/weatherkit"
edit_uri = "edit/main/docs/"

# The API section is added under Reference automatically by api-autonav (see below).
nav = [
  { "Home" = "index.md" },
  { "Tutorials" = [
    "tutorials/index.md",
    { "Getting started" = "tutorials/getting-started.md" },
  ] },
  { "How-to guides" = [
    "how-to/index.md",
    { "Use a custom provider" = "how-to/custom-provider.md" },
    { "Test with providers" = "how-to/test-with-providers.md" },
  ] },
  { "Reference" = [
    "reference/index.md",
    { "CLI" = "reference/cli.md" },
    { "Diagrams" = "reference/diagrams.md" },
  ] },
  { "Explanation" = [
    "explanation/index.md",
    { "Architecture" = "explanation/architecture.md" },
  ] },
]

[project.theme]
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.indexes",
  "navigation.top",
  "navigation.footer",
  "navigation.path",
  "search.highlight",
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
  "content.action.edit",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# --- API reference, generated from docstrings on every build -------------------------------
[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"  # match the codebase: google | numpy | sphinx
show_source = true
show_root_heading = true
show_signature_annotations = true
separate_signature = true
merge_init_into_class = true
members_order = "source"
filters = ["!^_"]

[project.plugins.api-autonav]
modules = ["src/weatherkit"]
api_root_uri = "reference/api"
nav_section_title = "API"
exclude_private = true

# --- Build-time code execution (generated diagrams page) -----------------------------------
[project.plugins.markdown-exec]

# --- Markdown -------------------------------------------------------------------------------
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.snippets = { base_path = [".", "docs"], check_paths = true }
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
