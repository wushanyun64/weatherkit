# Build the Zensical site and deploy it to GitHub Pages on every push to the default branch.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: docs-deploy

on:
  push:
    branches: [main]  # TODO: default branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install Graphviz (SVG diagrams; without it the diagrams page falls back to Mermaid)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz
      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt
      - uses: actions/configure-pages@v6
      - name: Build site (regenerates API reference and diagrams)
        run: zensical build --clean --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
