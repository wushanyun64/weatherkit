# Guard PRs: strict build, link check, doc example tests, and a docs-drift warning.
# Add the label "docs-not-needed" to a PR to silence the drift warning.
name: docs-check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # drift check diffs against the base branch
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz
      - run: pip install -r requirements-docs.txt -e .  # project needed for the CLI page

      - name: Strict build (broken links, missing snippets, stale API references)
        run: zensical build --clean --strict

      - name: Test code examples in docs
        if: hashFiles('tests/test_docs.py') != ''
        run: |
          pip install -e . pytest
          pytest tests/test_docs.py

      # Internal links are already checked by the strict build above (and point at pages that only
      # exist after the build), so lychee checks web links only. The site's own URL is excluded
      # because it 404s until the first deploy.
      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --accept 200,206,429
            --scheme https --scheme http
            --exclude '^https://wushanyun64\.github\.io/weatherkit'
            --exclude-path site
            './docs/**/*.md' README.md
          fail: true

      - name: Docs drift check
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'docs-not-needed') }}
        continue-on-error: true
        run: python tools/docs/check_drift.py --base "origin/${{ github.base_ref }}" --github
