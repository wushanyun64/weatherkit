# When source code changes land on the default branch, Claude reviews the diff and opens a PR
# that updates the hand-written docs (tutorials, how-tos, explanation, Mermaid diagrams).
# Setup: add the ANTHROPIC_API_KEY repo secret (or run /install-github-app in Claude Code), and
# Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull requests".
# Docs PRs only touch docs/**, which is outside the paths filter, so merging them can't loop.
name: docs-ai-update

on:
  push:
    branches: [main]  # TODO: default branch
    paths:
      - "src/**"      # TODO: source paths
      - "examples/**"
      - "pyproject.toml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-ai-update
  cancel-in-progress: true

jobs:
  update-docs:
    if: ${{ !contains(github.event.head_commit.message, '[skip docs]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz
      - run: pip install -r requirements-docs.txt
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh pr create:*),Bash(gh pr list:*),Bash(mkdocs build:*),Bash(python tools/docs/*)"
          prompt: |
            You maintain this repository's documentation (MkDocs Material, Diátaxis structure).

            1. Read docs/.doc-spec.yml — it defines audience, tone, scope, terminology, and which
               paths are generated. Follow it exactly.
            2. Inspect the code changes in this push:
               git diff --stat ${{ github.event.before }} ${{ github.sha }}
               git diff ${{ github.event.before }} ${{ github.sha }} -- . ':(exclude)docs'
               Optionally run: python tools/docs/check_drift.py --base ${{ github.event.before }}
            3. Decide which hand-written pages are now inaccurate or incomplete: tutorials,
               how-to guides, explanation pages, hand-written reference (config tables, CLI),
               Mermaid diagrams, README usage. Generated pages (API reference, diagrams page)
               update themselves — never create or edit them.
            4. If nothing needs changing, stop without creating a branch or PR.
            5. Otherwise edit the minimum needed, keep each page to one Diátaxis type, keep
               examples runnable, then run `mkdocs build --strict` and fix any warnings.
            6. Create branch docs/auto-update-${{ github.sha }}, commit with message
               "docs: update for ${{ github.sha }} [skip docs]", push, and open a PR with
               `gh pr create` against ${{ github.ref_name }}. In the PR body list each changed
               page and the code change that motivated it. Do not merge.
